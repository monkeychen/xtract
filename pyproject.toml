[project]
name = "xtract"
version = "0.1.0"
description = "Production-grade X (Twitter) intelligence radar & AI digest."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "chenzhian", email = "cza55007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "twikit>=2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
